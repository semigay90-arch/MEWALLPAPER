"use strict";
// ---------------------------------------------------------------- settings
const CFG = {
  parallax: 1.0,       // depth strength
  particles: 1.0,      // particle density
  glow: 1.0,           // pulse strength
  idleAfter: 2.5,      // seconds of no mouse before auto-drift
};
// Wallpaper Engine / Lively property hooks (optional)
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    if (p.parallax) CFG.parallax = p.parallax.value / 100;
    if (p.particles) CFG.particles = p.particles.value / 100;
    if (p.glow) CFG.glow = p.glow.value / 100;
  }
};
function livelyPropertyListener(name, val) {
  if (name === "parallax") CFG.parallax = val / 100;
  if (name === "particles") CFG.particles = val / 100;
  if (name === "glow") CFG.glow = val / 100;
}

const IMG_W = 1672, IMG_H = 941;

// ---------------------------------------------------------------- WebGL
const glc = document.getElementById("gl");
const gl = glc.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
const fxc = document.getElementById("fx");
const fx = fxc.getContext("2d");

const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform sampler2D uDepth;
uniform vec2 uRes;
uniform vec2 uImg;
uniform vec2 uMouse;      // -1..1 (smoothed, y up)
uniform vec2 uMouseUV;    // 0..1 screen uv (y up)
uniform float uTime;
uniform float uPar;
uniform float uGlow;
uniform vec4 uClick;      // xy = screen uv, z = seconds since click, w = active
uniform float uHover;     // 0..1 how recently the mouse moved

vec2 coverUV(vec2 uv){
  float sa = uRes.x / uRes.y;
  float ia = uImg.x / uImg.y;
  vec2 s = vec2(1.0);
  if (sa > ia) s.y = ia / sa; else s.x = sa / ia;
  return (uv - 0.5) * s + 0.5;
}
float G(vec2 uv, vec2 c, vec2 s){
  vec2 q = (uv - c) / s;
  return exp(-0.5 * dot(q, q));
}
// image pixel (x, y-down) -> uv (y-up)
vec2 P(float x, float y){ return vec2(x / ${IMG_W}.0, 1.0 - y / ${IMG_H}.0); }

void main(){
  vec2 iu = coverUV(vUv);
  float d = texture2D(uDepth, iu).r;

  // ---- parallax: near things move more than far things
  vec2 off = uMouse * (d - 0.32) * 0.050 * uPar;

  // ---- life: hair sway, hat/head drift, breathing
  float t = uTime;
  float hairB = G(iu, P(600.0, 190.0), vec2(0.09, 0.11));
  float ypx = (1.0 - iu.y) * ${IMG_H}.0;
  float ampB = clamp((330.0 - ypx) / 260.0, 0.0, 1.0);
  vec2 sway = vec2(sin(t * 2.0 + iu.x * 38.0), cos(t * 1.6 + iu.x * 25.0)) * hairB * 0.0036 * (0.4 + ampB);
  float hairC = G(iu, P(960.0, 300.0), vec2(0.04, 0.07));
  sway += vec2(sin(t * 2.2 + iu.y * 30.0), 0.0) * hairC * 0.0030;
  float body = G(iu, P(850.0, 600.0), vec2(0.28, 0.25));
  sway += vec2((iu.x - 0.5) * 0.0020, 0.0016) * sin(t * 1.1) * body;
  float bird = G(iu, P(1560.0, 320.0), vec2(0.03, 0.035));
  sway += vec2(sin(t * 1.3) * 0.006, sin(t * 2.6) * 0.003) * bird;

  // ---- click shockwave (screen space)
  vec2 asp = vec2(uRes.x / uRes.y, 1.0);
  vec2 cdir = (vUv - uClick.xy) * asp;
  float cdist = length(cdir);
  float ring = 0.0;
  if (uClick.w > 0.5) {
    float rad = uClick.z * 0.75;
    ring = exp(-pow((cdist - rad) / 0.045, 2.0)) * max(0.0, 1.0 - uClick.z / 1.4);
    sway += normalize(cdir + 1e-5) * ring * 0.018 / vec2(asp.x, 1.0);
  }

  vec2 suv = (iu - 0.5) / 1.09 + 0.5 + off + sway;
  vec3 col = texture2D(uTex, suv).rgb;

  // ---- glow pulses on the energy / sky / title
  float mx = max(col.r, max(col.g, col.b));
  float mn = min(col.r, min(col.g, col.b));
  float sat = (mx - mn) / max(mx, 0.001);
  float lit = smoothstep(0.30, 0.85, mx) * smoothstep(0.20, 0.60, sat);
  float warm = smoothstep(1.1, 1.8, col.r / (col.b + 0.02));
  float pc = 0.5 + 0.5 * sin(t * 1.7);
  float pw = 0.5 + 0.5 * sin(t * 1.7 + 2.3);
  col *= 1.0 + lit * uGlow * mix(0.40 * pc, 0.32 * pw, warm);

  float title = G(iu, P(835.0, 595.0), vec2(0.17, 0.065));
  col *= 1.0 + title * lit * uGlow * (0.30 + 0.50 * (0.5 + 0.5 * sin(t * 3.4)));

  // ---- glowing eye that wakes up near the cursor
  vec2 mIU = coverUV(uMouseUV);
  vec2 eye = P(546.0, 303.0);
  float eyeM = G(iu, eye, vec2(0.014, 0.020));
  float prox = exp(-pow(length((mIU - eye) * vec2(uImg.x / uImg.y, 1.0)) / 0.22, 2.0)) * uHover;
  col += vec3(1.0, 0.35, 0.85) * eyeM * (0.25 + 0.30 * sin(t * 3.0) + 1.6 * prox);

  // ---- cursor spotlight (cool on the left half, warm on the right half)
  float md = length((vUv - uMouseUV) * asp);
  float spot = exp(-pow(md / 0.20, 2.0)) * (0.35 + 0.65 * uHover);
  vec3 tint = mix(vec3(0.45, 0.55, 1.0), vec3(1.0, 0.55, 0.30), smoothstep(0.42, 0.58, uMouseUV.x));
  col = col * (1.0 + spot * 0.95) + tint * spot * 0.09;

  // ---- ring tint
  col += mix(vec3(0.5, 0.6, 1.0), vec3(1.0, 0.65, 0.4), smoothstep(0.42, 0.58, uClick.x)) * ring * 0.55;

  // ---- vignette
  float v = length((vUv - 0.5) * vec2(1.0, 0.9));
  col *= 1.0 - 0.38 * smoothstep(0.35, 0.85, v);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
["uTex", "uDepth", "uRes", "uImg", "uMouse", "uMouseUV", "uTime", "uPar", "uGlow", "uClick", "uHover"]
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

function makeTex(img, unit) {
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

// ---------------------------------------------------------------- input
let W = 0, H = 0, DPR = 1;
const target = { x: 0, y: 0 };        // -1..1
const smooth = { x: 0, y: 0 };
const mousePx = { x: 0, y: 0 };
const mouseUV = { x: 0.5, y: 0.5 };
let lastMove = -100;
let hover = 0;
const click = { x: 0.5, y: 0.5, t0: -100, active: 0 };

function setMouse(cx, cy, now) {
  mousePx.x = cx; mousePx.y = cy;
  target.x = (cx / W) * 2 - 1;
  target.y = -((cy / H) * 2 - 1);
  mouseUV.x = cx / W; mouseUV.y = 1 - cy / H;
  lastMove = now;
}
window.addEventListener("mousemove", e => setMouse(e.clientX, e.clientY, performance.now() / 1000));
window.addEventListener("touchmove", e => { const t = e.touches[0]; setMouse(t.clientX, t.clientY, performance.now() / 1000); }, { passive: true });
window.addEventListener("pointerdown", e => {
  const now = performance.now() / 1000;
  setMouse(e.clientX, e.clientY, now);
  click.x = mouseUV.x; click.y = mouseUV.y; click.t0 = now; click.active = 1;
  burst(e.clientX, e.clientY);
});
window.addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  glc.width = Math.round(W * DPR); glc.height = Math.round(H * DPR);
  gl.viewport(0, 0, glc.width, glc.height);
  fxc.width = Math.round(W * DPR); fxc.height = Math.round(H * DPR);
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------------------------------------------------------------- particles
const COOL = ["rgba(140,170,255,", "rgba(190,120,255,", "rgba(120,220,255,"];
const WARM = ["rgba(255,170,80,", "rgba(255,120,60,", "rgba(255,210,120,"];
let parts = [];

function palette(x) { const a = x / W < 0.5 ? COOL : WARM; return a[(Math.random() * a.length) | 0]; }

function ambient() {
  const x = Math.random() * W;
  return {
    x, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.15, vy: -(0.15 + Math.random() * 0.5),
    bx: 0, by: 0, size: 0.8 + Math.random() * 2.2, life: 1, max: 1, col: palette(x),
    amb: true, ph: Math.random() * 6.28, sw: 8 + Math.random() * 22,
  };
}
function initAmbient() {
  parts = parts.filter(p => !p.amb);
  const n = Math.round(150 * CFG.particles * (W * H) / (1600 * 900));
  for (let i = 0; i < n; i++) parts.push(ambient());
}
initAmbient();
window.addEventListener("resize", initAmbient);

function trail(x, y) {
  for (let i = 0; i < 2; i++) {
    parts.push({
      x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2 - 0.3,
      size: 1.2 + Math.random() * 2.8, life: 0.9, max: 0.9, col: palette(x), amb: false,
    });
  }
}
function burst(x, y) {
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * 6.283, s = 2 + Math.random() * 8;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      size: 1.2 + Math.random() * 3.2, life: 1.1, max: 1.1, col: palette(x), amb: false, grav: 0.09,
    });
  }
}

let lastTrailX = 0, lastTrailY = 0;
function stepParticles(dt, t) {
  fx.clearRect(0, 0, W, H);
  const R = 150;
  const moving = (t - lastMove) < 0.1;
  if (moving) {
    const dx = mousePx.x - lastTrailX, dy = mousePx.y - lastTrailY;
    if (dx * dx + dy * dy > 16) { trail(mousePx.x, mousePx.y); lastTrailX = mousePx.x; lastTrailY = mousePx.y; }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.amb) {
      const dx = p.x - mousePx.x, dy = p.y - mousePx.y;
      const dist = Math.hypot(dx, dy);
      if (dist < R && hover > 0.05) {
        const f = (1 - dist / R) * 1.4 * hover;
        p.vx += (dx / (dist + 0.01)) * f; p.vy += (dy / (dist + 0.01)) * f;
      }
      p.vx *= 0.96; p.vy = p.vy * 0.96 + (-(0.15 + 0.35)) * 0.04 * 0.5;
      p.x += p.vx * dt * 60 + Math.sin(t * 0.9 + p.ph) * p.sw * 0.004;
      p.y += p.vy * dt * 60;
      if (p.y < -10 || p.x < -20 || p.x > W + 20) { Object.assign(p, ambient(), { y: H + 10 }); }
      const tw = 0.55 + 0.45 * Math.sin(t * 2 + p.ph);
      draw(p, tw * 0.9, 1);
    } else {
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vx *= 0.985; p.vy = p.vy * 0.985 + (p.grav || 0);
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
      draw(p, Math.pow(p.life / p.max, 1.3), 1.15);
    }
  }
}
function draw(p, a, k) {
  fx.fillStyle = p.col + (a * 0.22).toFixed(3) + ")";
  fx.beginPath(); fx.arc(p.x, p.y, p.size * 3.2 * k, 0, 6.283); fx.fill();
  fx.fillStyle = p.col + Math.min(1, a).toFixed(3) + ")";
  fx.beginPath(); fx.arc(p.x, p.y, p.size * k, 0, 6.283); fx.fill();
}

// ---------------------------------------------------------------- main
function load(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

Promise.all([load(WALL_SRC), load(DEPTH_SRC)]).then(([wall, depth]) => {
  makeTex(wall, 0);
  makeTex(depth, 1);
  gl.uniform1i(U.uTex, 0);
  gl.uniform1i(U.uDepth, 1);
  gl.uniform2f(U.uImg, IMG_W, IMG_H);

  let prev = performance.now() / 1000;
  const t0 = prev;
  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const now = performance.now() / 1000;
    const dt = Math.min(0.05, now - prev); prev = now;
    const t = now - t0;

    // idle auto-drift so the wallpaper still feels alive without a cursor
    const idle = now - lastMove > CFG.idleAfter;
    if (idle) {
      target.x = Math.sin(t * 0.32) * 0.6;
      target.y = Math.cos(t * 0.23) * 0.35;
    }
    smooth.x += (target.x - smooth.x) * Math.min(1, dt * 4);
    smooth.y += (target.y - smooth.y) * Math.min(1, dt * 4);
    hover += ((idle ? 0 : 1) - hover) * Math.min(1, dt * 3);

    gl.uniform2f(U.uRes, glc.width, glc.height);
    gl.uniform2f(U.uMouse, smooth.x, smooth.y);
    gl.uniform2f(U.uMouseUV, mouseUV.x, mouseUV.y);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uPar, CFG.parallax);
    gl.uniform1f(U.uGlow, CFG.glow);
    gl.uniform1f(U.uHover, hover);
    const ct = now - click.t0;
    gl.uniform4f(U.uClick, click.x, click.y, ct, ct < 1.4 ? click.active : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    stepParticles(dt, now);
  }
  frame();
}).catch(e => { document.body.style.background = "#200"; console.error("Failed to load wallpaper assets", e); });
</script>
</body>
</html>
